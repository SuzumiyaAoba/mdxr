name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          # pnpm 11 requires Node >= 22.13 (uses node:sqlite), which is newer
          # than the runner's default Node. The standalone binary bundles its
          # own runtime so pnpm works regardless of the system Node version;
          # test/build scripts still run under the matrix Node on PATH.
          standalone: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # ultracite pulls in execa 10, which requires Node >= 22.
      - run: pnpm check
        if: matrix.node-version != 20

      # tsgolint (via `pnpm check`) runs type-aware lint rules but is not a
      # full typecheck — keep a real tsc pass on every matrix leg.
      - run: pnpm typecheck

      # The storybook Vitest project runs component tests in Chromium via
      # @storybook/addon-vitest; browser binaries aren't part of pnpm install.
      - run: pnpm exec playwright install --with-deps chromium

      # vp pack uses Promise.withResolvers (Node >= 22). Build under 22 even
      # on the Node 20 leg — matching how released dist/ is produced — then
      # switch back so `pnpm test` exercises the artifact on the matrix Node.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: matrix.node-version == 20
        with:
          node-version: 22

      # Tests bundle user components that self-import `mdxr`; Node resolves
      # that via this package's `exports`, which point at dist/ — so the
      # build must run first.
      - run: pnpm build

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: matrix.node-version == 20
        with:
          node-version: 20

      - run: pnpm test
