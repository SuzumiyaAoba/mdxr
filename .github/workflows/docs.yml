name: Docs

on:
  # src/ and scripts/ are included because the gallery embeds output rendered
  # by the current CLI — docs should redeploy when the renderer changes.
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "src/**"
      - "examples/**"
      - "scripts/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "src/**"
      - "examples/**"
      - "scripts/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Deploys are serialized; a stale deploy is worse than a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: `lastModified` derives each page's date from git.
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          # Standalone binary bundles its own runtime (see ci.yml); Blume
          # still requires Node >= 22.12 on PATH, installed below.
          standalone: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            docs/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # docs/ is a nested pnpm workspace root (own lockfile + settings), so
      # the library's dependency graph stays untouched.
      - run: pnpm --dir docs install --frozen-lockfile

      # The gallery and component catalog embed real mdxr output — build
      # the CLI, render examples/*.mdx → docs/public/examples/ and
      # examples/catalog/*.mdx → docs/public/components/ so the docs
      # always show what the current renderer produces.
      - run: pnpm build
      - run: pnpm docs:render

      # Blume builds static HTML + search index + llms.txt into docs/dist/.
      - run: pnpm --dir docs build

      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          # v6 defaults this to false; without it a repo that never had
          # Pages configured fails with "Get Pages site failed".
          enablement: true

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
