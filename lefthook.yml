pre-commit:
  jobs:
    - run: pnpm dlx ultracite fix
      glob:
        - "**/*.js"
        - "**/*.jsx"
        - "**/*.ts"
        - "**/*.tsx"
        - "**/*.json"
        - "**/*.jsonc"
        - "**/*.css"
      stage_fixed: true
    - name: react-doctor
      run: pnpm exec react-doctor --staged --blocking none || true
