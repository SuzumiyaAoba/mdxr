name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm provenance attestation

jobs:
  publish:
    runs-on: ubuntu-latest
    # Configure required reviewers on the `release` environment in repo
    # settings to gate npm publishes behind manual approval.
    environment: release
    steps:
      # persist-credentials: false — no step pushes to git, so the checkout
      # token does not need to be stored in .git/config where dependency
      # install/build scripts could read it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # pnpm 11 requires Node >= 22.13; the standalone binary bundles its
          # own runtime (see ci.yml).
          standalone: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION=${GITHUB_REF_NAME#v}
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      # Build before test: tests self-import `@suzumiyaaoba/mdxr`, which
      # resolves via `exports` to dist/ (see ci.yml).
      - run: pnpm build

      # The storybook Vitest project runs component tests in Chromium via
      # @storybook/addon-vitest; browser binaries aren't part of pnpm install.
      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test

      # --no-git-checks: tag checkouts are detached HEAD.
      # Requires the NPM_TOKEN repo secret (npm granular access token).
      - run: pnpm publish --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
