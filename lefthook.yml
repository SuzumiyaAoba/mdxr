pre-commit:
  jobs:
    # pnpm exec uses the lockfile-pinned ultracite (a dlx fetch would bypass
    # minimumReleaseAge); {staged_files} scopes the fix to this commit.
    - run: pnpm exec ultracite fix {staged_files}
      glob:
        - "**/*.js"
        - "**/*.jsx"
        - "**/*.ts"
        - "**/*.tsx"
        - "**/*.json"
        - "**/*.jsonc"
        - "**/*.css"
      # Staged-files typecheck builds a program from the listed files only,
      # so ambient declarations in .storybook/globals.d.ts (*.css) are out of
      # scope — .storybook stays covered by the repo-wide `pnpm check`.
      exclude:
        - ".storybook/**"
      stage_fixed: true
    - name: react-doctor
      run: pnpm exec react-doctor --staged --blocking none || true
